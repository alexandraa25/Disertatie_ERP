<div class="notifications-section">

      <div *ngIf="loadingNotifications" class="notifications-loading">
        Se încarcă notificările...
      </div>

      <form *ngIf="!loadingNotifications" [formGroup]="notificationForm">

        <p>Alege cum vrei să primești notificările pentru activitățile interne.</p>

        <div formArrayName="settings" class="notifications-list">

          <div *ngFor="let group of settings.controls; let i = index" [formGroupName]="i" class="notification-card">

            <div class="notification-main">
              <div>
                <h3>{{ getNotificationLabel(group.value.eventType) }}</h3>
                <span class="notification-channel">
                  {{ getChannelLabel(group.value.channel) }}
                </span>
              </div>

              <label class="switch-row">
                <input type="checkbox" formControlName="enabled">
                <span>Primește notificări</span>
              </label>
            </div>

            <div class="notification-options">
              <label>
                Frecvență notificare
                <select formControlName="digest">
                  <option [ngValue]="DigestMode.Immediate">Imediat</option>
                  <option [ngValue]="DigestMode.Daily">Zilnic - rezumat</option>
                </select>
              </label>
            </div>
          </div>
        </div>

        <div class="notifications-actions">
          <button type="button" (click)="saveNotifications()" [disabled]="savingNotifications">
            {{ savingNotifications ? 'Se salvează...' : 'Salvează modificările' }}
          </button>
        </div>
      </form>
    </div>
